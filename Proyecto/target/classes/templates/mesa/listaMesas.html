<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Mesas</title>
    <style>
        /* Body y títulos */
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6f0; /* fondo café claro */
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #8b5e3c; /* café oscuro */
            margin-bottom: 20px;
        }

        /* Tabla */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #f5e8de;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #8b5e3c;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background-color: #c49b7c;
            color: #fff;
            font-weight: bold;
        }
        tbody tr:nth-child(even) {
            background-color: #f8e9de;
        }
        tbody tr:hover {
            background-color: #f2d9b5;
        }

        /* Botones dentro de la tabla */
        a.button {
            display: inline-block;
            padding: 6px 12px;
            background-color: #8b5e3c;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 6px;
            margin-bottom: 4px;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        a.button:hover {
            background-color: #6f482f;
        }

        /* Botón eliminar destacado */
        td a.delete {
            background-color: #a52a2a;
        }
        td a.delete:hover {
            background-color: #7f1f1f;
        }

        /* Contenedor botón agregar */
        .center {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Botones inferiores */
        .action-buttons {
            text-align: center;
            margin-top: 20px;
        }
        .action-buttons button {
            padding: 10px 18px;
            background-color: #8b5e3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .action-buttons button:hover {
            background-color: #6f482f;
        }
    </style>
</head><!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>
<body>
    <h1>Lista de Mesas</h1>
    <!-- Tabla de Mesas -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Capacidad</th>
                <th>Ubicación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mesa : ${mesas}">
                <td th:text="${mesa.idMesa}"></td>
                <td th:text="${mesa.capacidad}"></td>
                <td th:text="${mesa.ubicacion}"></td>
                <td>
                	<a th:href="@{/mesa/ver/{id}(id=${mesa.idMesa})}" class="button">Detalles</a>
                    <a th:href="@{'/mesa/editar/' + ${mesa.idMesa}}" class="button">Editar</a>
                    <a th:href="@{'/mesa/eliminar/' + ${mesa.idMesa}}" 
                       class="button delete"
                       onclick="return confirm('¿Estás seguro de eliminar esta mesa?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Botones inferiores -->
    <div class="action-buttons">
        <a th:href="@{/home}"><button type="button">Volver</button></a>
        <a th:href="@{/mesa/nueva}"><button type="button">Agregar Mesa</button></a>
    </div>

    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
