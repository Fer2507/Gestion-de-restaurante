<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Producto</title>
</head>
<body>
    <h1 th:text="'Nombre: ' + ${nom}"></h1>
    <p th:text="'Tipo: ' + ${tipo}"></p>
    <p th:text="'Descripción: ' + ${descripcion}"></p>
    <p th:text="'Precio: $' + ${precio}"></p> 
    <img th:src="@{'/images/' + ${fotoProducto}}" alt="Imagen Producto"/>
<div style="margin-top: 40px;">
    <a th:href="@{/home}"><button type="button">Volver</button></a>
</div>
</body>
<div th:replace="fragments/footer :: footer"></div>
</html>
