<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Detalle del Pedido</title>
<style>
	body {
		font-family: 'Segoe UI', Arial, sans-serif;
		background-color: #f5ebe0;
		padding: 20px;
		color: #4e342e;
	}
	h1 {
		text-align: center;
		color: #6d4c41;
		text-transform: uppercase;
		margin-bottom: 25px;
	}
	.info {
		margin-bottom: 25px;
		text-align: center;
		background-color: #d7ccc8;
		display: inline-block;
		padding: 15px 30px;
		border-radius: 10px;
		box-shadow: 0 2px 8px rgba(0,0,0,0.15);
	}
	.info p {
		margin: 8px 0;
		color: #5d4037;
		font-size: 15px;
	}
	table {
		width: 80%;
		margin: 0 auto;
		border-collapse: collapse;
		background: #fff8e1;
		box-shadow: 0 0 10px rgba(0,0,0,0.15);
		border-radius: 8px;
		overflow: hidden;
	}
	th, td {
		border: 1px solid #bcaaa4;
		padding: 12px;
		text-align: center;
	}
	th {
		background-color: #8d6e63;
		color: #fff;
		text-transform: uppercase;
		letter-spacing: 0.5px;
	}
	tbody tr:nth-child(even) {
		background-color: #f0e6da;
	}
	tfoot td {
		font-weight: bold;
		background-color: #d7ccc8;
		color: #3e2723;
	}
	a {
		display: inline-block;
		margin: 25px auto 0;
		padding: 10px 20px;
		background-color: #8d6e63;
		color: #fff;
		text-decoration: none;
		border-radius: 5px;
		transition: background-color 0.3s ease;
	}
	a:hover {
		background-color: #6d4c41;
	}
</style>
</head>
<body>

	<h1>Detalle del Pedido</h1>

	<div class="info">
		<p><strong>ID Pedido:</strong> <span th:text="${pedido.idpedido}"></span></p>
		<p><strong>ID Reserva:</strong> 
			<span th:text="${pedido.reserva != null} ? ${pedido.reserva.idReserva} : 'Sin reserva'"></span>
		</p>
		<p><strong>Cliente:</strong> <span th:text="${pedido.cliente.nombre}"></span></p>
		<p><strong>Empleado que atendió:</strong> 
			<span th:text="${pedido.atenciones != null && !pedido.atenciones.isEmpty() ? pedido.atenciones[0].empleado.nombreCompleto : 'No asignado'}"></span>
		</p>
		<p><strong>Fecha:</strong> <span th:text="${pedido.fecha}"></span></p>
	</div>

	<table>
		<thead>
			<tr>
				<th>Producto</th>
				<th>Cantidad</th>
				<th>Precio Unitario</th>
				<th>Subtotal</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="detalle : ${detalles}">
				<td th:text="${detalle.producto.nombre}"></td>
				<td th:text="${detalle.cantidad}"></td>
				<td th:text="${detalle.precioUnitario}"></td>
				<td th:text="${detalle.subtotal}"></td>
			</tr>
		</tbody>
		<tfoot>
			<tr>
				<td colspan="3">Total</td>
				<td th:text="${pedido.total}"></td>
			</tr>
		</tfoot>
	</table>
    <a th:href="@{'/ticket/imprimir/' + ${pedido.idpedido}}" class="button"> Imprimir Ticket</a>
	<a th:href="@{/pedidos/lista}">Volver a la lista</a>

</body>
<div th:replace="fragments/footer :: footer"></div>
</html>
