<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empleados</title>
    <style>
        /* ======= ESTRUCTURA GENERAL ======= */
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6f0; /* fondo café claro */
            color: #333;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #8b5e3c;
            margin-bottom: 20px;
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* ======= TABLA ======= */
        table {
            width: 75%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #f5e8de;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #8b5e3c;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #c49b7c;
            color: #fff;
            font-weight: bold;
        }

        tbody tr:nth-child(even) { background-color: #f8e9de; }
        tbody tr:hover { background-color: #f2d9b5; }

        /* ======= BOTONES DE TABLA ======= */
        a.button {
            display: inline-block;
            padding: 6px 12px;
            background-color: #8b5e3c;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 6px;
            margin-bottom: 4px;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        a.button:hover {
            background-color: #6f482f;
        }

        /* Botón eliminar */
        a.delete {
            background-color: #a52a2a;
        }

        a.delete:hover {
            background-color: #7f1f1f;
        }

        /* ======= PANEL DE BÚSQUEDA ======= */
        .search-container {
            width: 260px;
            background-color: #f5e8de;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.15);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .search-container h2 {
            text-align: center;
            color: #6f4e37;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-form label {
            font-weight: bold;
            color: #5a3e2b;
            font-size: 14px;
        }

        .search-form input {
            padding: 6px;
            border: 1px solid #c4a484;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-form button {
            background-color: #a47148;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-form button:hover {
            background-color: #7b4f2c;
        }

        /* ======= BOTONES DE ACCIÓN ======= */
        .action-buttons {
            text-align: center;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-buttons a, 
        .action-buttons button {
            display: inline-block;
            padding: 8px 14px;
            background-color: #8b5e3c;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .action-buttons a:hover,
        .action-buttons button:hover {
            background-color: #6f482f;
        }
    </style>
</head>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>
<body>

    <h1>Lista de Empleados</h1>

    <div class="main-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre Completo</th>
                    <th>Puesto</th>
                    <th>Clave</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="empleado : ${empleados}">
                    <td th:text="${empleado.idEmpleado}"></td>
                    <td th:text="${empleado.nombreCompleto}"></td>
                    <td th:text="${empleado.puesto}"></td>
                    <td th:text="${empleado.clave}"></td>
                    <td>
                        <a th:href="@{/empleado/ver/{id}(id=${empleado.idEmpleado})}" class="button">Detalles</a>
                        <a th:href="@{'/empleado/editar/' + ${empleado.idEmpleado}}" class="button">Editar</a>
                        <a th:href="@{'/empleado/eliminar/' + ${empleado.idEmpleado}}" 
                           class="button delete"
                           onclick="return confirm('¿Estás seguro de eliminar este empleado?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Panel de búsqueda -->
        <div class="search-container">
            <h2>Buscar Empleados</h2>
            <form class="search-form" th:action="@{/buscar/empleado}" method="post">
                <label>Nombre o letra:</label>
                <input type="text" name="nombreCompleto" placeholder="Ej: Ana o letra A" required>
                <button type="submit">Buscar</button>
            </form>

            <div class="action-buttons">
                <a th:href="@{/empleado}" class="button">Ver todos</a>
                <a th:href="@{/empleado/nuevo}" class="button">Agregar</a>
                <a th:href="@{/home}" class="button">Volver</a>
            </div>
        </div>
    </div>

    
</body>
<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
</html>
