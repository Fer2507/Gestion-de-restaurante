<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
     <style>
        /* Body y títulos */
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6f0; /* fondo café claro */
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #8b5e3c; /* café oscuro */
            margin-bottom: 20px;
        }
        /* Contenedor principal */
         .main-container {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 25px;
    	}

        /* Tabla */
        table {
            width: 100%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #f5e8de;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #8b5e3c;
            text-align: left;
            vertical-align: middle;
        }
        td img {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 6px;
        box-shadow: 0 0 4px rgba(0,0,0,0.2);
   		 }
        th {
            background-color: #c49b7c;
            color: #fff;
            font-weight: bold;
        }
        tbody tr:nth-child(even) {
            background-color: #f8e9de;
        }
        tbody tr:hover {
            background-color: #f2d9b5;
        }

        /* Botones dentro de la tabla */
        a.button {
            display: inline-block;
            padding: 6px 12px;
            background-color: #8b5e3c;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 6px;
            margin-bottom: 4px;
            font-size: 13px;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        a.button:hover {
            background-color: #6f482f;
        }

        /* Botón eliminar destacado */
        td a.delete {
            background-color: #a52a2a;
        }
        td a.delete:hover {
            background-color: #7f1f1f;
        }

        /* Contenedor botón agregar */
        .center {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Botones inferiores */
        .action-buttons {
            text-align: center;
            margin-top: 20px;
        }
        .action-buttons button {
            padding: 10px 18px;
            background-color: #8b5e3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .action-buttons button:hover {
            background-color: #6f482f;
        }
        .opciones-container {
        width: 260px;
        background-color: #f5e8de;
        border-radius: 10px;
        box-shadow: 0 0 8px rgba(0,0,0,0.15);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        height: fit-content;
	    }
	    .opciones button {
	        background-color: #a47148;
	        color: #fff;
	        border: none;
	        padding: 7px 14px;
	        border-radius: 5px;
	        cursor: pointer;
	        transition: background-color 0.3s;
	    }
	
	    .opciones-form button:hover {
	        background-color: #7b4f2c;
	    }
    </style>
</head>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>
<body>
<h2 style="text-align: center;">Lista de Clientes</h2>
 <div class="main-container">
<table>
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Nombre Completo</th>
        <th scope="col">Crédito</th>
        <th scope="col">Teléfono</th>
        <th scope="col">Email</th>
        <th scope="col">Clave</th>
        <th scope="col">Cliente Destacado</th>
        <th scope="col">Foto</th>
        <th scope="col">Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.id}"></td>
        <td th:text="${cliente.nombre + ' ' + cliente.apellidos}"></td>
        <td th:text="${cliente.credito}"></td>
        <td th:text="${cliente.telefono}"></td>
        <td th:text="${cliente.email}"></td>
        <td th:text="${cliente.clave}"></td>
        <td th:text="${cliente.destacado == 1 ? 'Sí' : 'No'}"></td>
        <td>
            <img th:src="@{/imagen/cliente/{foto}(foto=${cliente.nombreFoto})}" alt="no_imagen.jpg">
        </td>
        <td>
            <p><a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="button">Modificar</a></p>
            <p><a th:href="@{/clientes/ver/{id}(id=${cliente.id})}" class="button">Detalles</a></p>
            <p><a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}" 
               onclick="return confirm('¿Estás seguro de eliminar este cliente?')" class="button">Eliminar</a></p>
        </td>
    </tr>
    </tbody>
</table>

 <div class="opciones-container">
        <a th:href="@{/clientes/crear}" class="button">Agregar Cliente</a>
        <a th:href="@{/busquedas}" class="button">Buscar Cliente</a>
    </div>
</div>
</body>
<div th:replace="~{fragments/footer :: footer}"></div>
</html>
