<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Lista de Pedidos</title>
<style>
/* ======= CONTENEDOR PRINCIPAL ======= */
.main-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 25px;
}

/* ======= BODY Y TITULOS ======= */
body {
    font-family: Arial, sans-serif;
    background-color: #fdf6f0; 
    color: #333;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #8b5e3c; 
    margin-bottom: 20px;
}

/* ======= TABLA ======= */
.main-container > div:first-child {
    flex: 3 1 0%; /* tabla ocupa la mayor parte del ancho */
    min-width: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background-color: #f5e8de;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 12px 15px;
    border: 1px solid #8b5e3c;
    text-align: left;
    vertical-align: middle;
}

th {
    background-color: #c49b7c;
    color: #fff;
    font-weight: bold;
}

tbody tr:nth-child(even) {
    background-color: #f8e9de;
}

tbody tr:hover {
    background-color: #f2d9b5;
}

td img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 0 4px rgba(0,0,0,0.2);
}

/* ======= BOTONES ======= */
a.button {
    display: inline-block;
    padding: 6px 12px;
    background-color: #8b5e3c;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    margin-right: 6px;
    margin-bottom: 4px;
    font-size: 14px;
    text-align: center;
    transition: background-color 0.3s ease;
}

a.button:hover {
    background-color: #6f482f;
}

td a.delete {
    background-color: #a52a2a;
}

td a.delete:hover {
    background-color: #7f1f1f;
}

/* ======= PANEL DE BÚSQUEDA (DERECHA) ======= */
.search-container {
    flex: 1 1 ; /* más compacto */
    background-color: #f5e8de;
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    height: fit-content;
}

.search-container h2 {
    text-align: center;
    color: #6f4e37;
    margin-bottom: 10px;
    font-size: 18px;
}

.search-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.search-form input,
.search-form select {
    padding: 6px;
    border: 1px solid #c4a484;
    border-radius: 5px;
    font-size: 14px;
}

.search-form button {
    background-color: #a47148;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.search-form button:hover {
    background-color: #7b4f2c;
}

/* Botones inferiores dentro del panel */
.search-container a.button {
    background-color: #a47148;
    text-align: center;
}

.search-container a.button:hover {
    background-color: #7b4f2c;
}

/* ======= RESPONSIVE ======= */
@media (max-width: 900px) {
    .main-container {
        flex-direction: column;
        align-items: center;
    }

    .main-container > div:first-child,
    .search-container {
        flex: 1 1 100%;
        width: 100%;
    }

    .search-container {
        order: -1; /* mover arriba en móvil */
        margin-bottom: 20px;
    }
}
</style>
</head>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>
<body>
<h1>Lista de Pedidos</h1>

<div class="main-container">
    <!-- TABLA -->
    <div>
        <table>
            <thead>
                <tr>
                    <th>ID Reserva</th>
                    <th>ID Pedido</th>
                    <th>Cliente</th>
                    <th>Empleado</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.reserva != null ? pedido.reserva.idReserva : 'Sin reserva'}"></td>
                    <td th:text="${pedido.idpedido}"></td>
                    <td th:text="${pedido.cliente.nombre}"></td>
                    <td th:text="${pedido.atenciones != null && !pedido.atenciones.isEmpty() ? pedido.atenciones[0].empleado.nombreCompleto : 'No asignado'}"></td>
                    <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${pedido.total != null ? '$' + pedido.total : 'N/A'}"></td>
                    <td>
                        <a th:href="@{/pedidos/detalles/{id}(id=${pedido.idpedido})}" class="button">Detalles</a>
                        <a th:href="@{'/ticket/imprimir/' + ${pedido.idpedido}}" class="button"> Imprimir Ticket</a>
                        
                        <a th:href="@{/pedidos/editar/{id}(id=${pedido.idpedido})}" class="button">Modificar</a>
                        <a th:href="@{/pedidos/eliminar/{id}(id=${pedido.idpedido})}" class="button" onclick="return confirm('¿Estás seguro de eliminar este pedido?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- PANEL DE BÚSQUEDA -->
    <div class="search-container">
        <h2>Buscar Pedidos</h2>

        <!-- Fecha exacta -->
        <form th:action="@{/buscar/pedido/fechaExacta}" method="post" class="search-form">
            <label>Fecha exacta:</label>
            <input type="date" name="fecha" required>
            <button type="submit">Buscar</button>
        </form>

        <!-- Rango de fechas -->
        <form th:action="@{/buscar/pedido/rango}" method="post" class="search-form">
            <label>Desde:</label>
            <input type="date" name="fechaInicio" required>
            <label>Hasta:</label>
            <input type="date" name="fechaFin" required>
            <button type="submit">Buscar</button>
        </form>

        <!-- Por empleado -->
        <form th:action="@{/buscar/pedido/empleado}" method="post" class="search-form">
            <label>Empleado:</label>
            <select name="idEmpleado" required>
                <option value="">- Seleccione un empleado -</option>
                <option th:each="e : ${empleados}" 
                        th:value="${e.idEmpleado}" 
                        th:text="${e.nombreCompleto}"></option>
            </select>
            <button type="submit">Buscar</button>
        </form>

        <!-- Por cliente -->
        <form th:action="@{/buscar/pedido/cliente}" method="post" class="search-form">
            <label>Cliente:</label>
            <select name="Id" required>
                <option value="">- Seleccione un Cliente -</option>
                <option th:each="c : ${clientes}" 
                        th:value="${c.Id}"
                        th:text="${c.nombre}"></option>
            </select>
            <button type="submit">Buscar</button>
        </form>

        <!-- Botones inferiores -->
        <div style="margin-top: 20px;">
            <a th:href="@{/pedidos/lista}" class="button">Ver todos</a>
            <a th:href="@{/home}" class="button">Volver</a>
            <a th:href="@{/pedidos/crear}" class="button">Crear Nueva Venta</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
