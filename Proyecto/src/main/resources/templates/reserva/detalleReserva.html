<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Reserva</title>
 <style>
    /* Estilo general */
    body {
      font-family: Arial, sans-serif;
      background-color: #fdf6f0; /* beige claro */
      color: #4b2e05; /* café oscuro */
      padding: 40px;
    }

    h2, h3 {
      text-align: center;
      color: #8b5e3c; /* café medio */
      margin-bottom: 20px;
    }

    /* Tarjeta de detalles */
    .card {
      background: #fff8f0; /* crema */
      padding: 20px;
      border-radius: 10px;
      margin: 0 auto 25px;
      max-width: 600px;
      box-shadow: 0 2px 8px rgba(90, 56, 28, 0.2);
    }

    .card p {
      margin: 10px 0;
      font-size: 16px;
    }

    .card strong {
      color: #6f4e37; /* café tostado */
    }

    /* Tabla de pedidos */
    table {
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
      background-color: #f5e8de;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #8b5e3c;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #c49b7c; /* café claro */
      color: #fff;
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background-color: #f8e9de;
    }

    tbody tr:hover {
      background-color: #f2d9b5;
    }

    /* Botones y enlaces */
    a, button {
      display: inline-block;
      background: #a47148; /* café medio */
      color: #fff;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 14px;
      margin: 6px;
      transition: background-color 0.3s ease;
    }

    a:hover, button:hover {
      background: #7b4f2c; /* café más oscuro */
    }

    /* Contenedor de botones inferiores */
    .footer-btns {
      text-align: center;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <h2>Detalle de la Reserva</h2>

  <div class="card">
    <p><strong>ID Reserva:</strong> <span th:text="${reserva.idReserva}"></span></p>
    <p><strong>Cliente:</strong> <span th:text="${reserva.cliente.nombre}"></span></p>
    <p><strong>Mesa:</strong> <span th:text="${reserva.mesa.idMesa}"></span></p>
    <p><strong>Fecha y Hora:</strong> <span th:text="${#temporals.format(reserva.fechaHora, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p><strong>Estatus:</strong> <span th:text="${reserva.estatus}"></span></p>
  </div>

  <h3>Pedidos asociados a esta reserva</h3>
  <table>
    <thead>
      <tr>
        <th>ID Pedido</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${reserva.pedidos}">
        <td th:text="${p.idpedido}"></td>
        <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${p.total}"></td>
        <td>
          <a th:href="@{/pedidos/detalles/{id}(id=${p.idpedido})}">Ver Detalle</a>
        </td>
      </tr>
      <tr th:if="${reserva.pedidos == null or reserva.pedidos.isEmpty()}">
        <td colspan="4">No hay pedidos asociados a esta reserva</td>
      </tr>
    </tbody>
  </table>

  <br>
  <a th:href="@{/pedidos/nuevo/{idReserva}(idReserva=${reserva.idReserva})}">Añadir Pedido para esta Reserva</a>
  <br><br>
  <a th:href="@{/reserva/lista}">Volver a Lista</a>

</body>
</html>
