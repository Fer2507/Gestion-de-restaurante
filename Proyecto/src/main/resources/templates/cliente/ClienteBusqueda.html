<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Búsquedas de Clientes</title>
    <style>
    body { 
        font-family: Arial, sans-serif; 
        margin: 0; 
        background-color: #fdf6f0; /* beige claro */
        color: #3e2723; /* café oscuro */
    }

    h2 { 
        text-align: center; 
        padding: 20px 0;
        color: #5c4033; /* tono café medio */
        font-style: italic; 
    }

    /* Contenedor principal de los formularios */
    .search-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        margin: 0 auto 20px;
        max-width: 1000px;
    }

    .search-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #fff3e0; /* beige */
        padding: 15px;
        border-radius: 10px;
        flex: 1 1 400px;
        border: 1px solid #d7b899;
    }

    .form-row {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid #b08968;
        background-color: #fffaf3;
    }

    button {
        padding: 10px 22px;
        background: #8b5e3c; /* café principal */
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.3s, transform 0.2s;
    }

    button:hover {
        background: #6d4c41; /* café más oscuro */
        transform: scale(1.05);
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    table { 
        width: 90%; 
        margin: 0 auto 30px; 
        border-collapse: collapse; 
        background: #ffffff; 
        color: #3e2723; 
        border-radius: 8px;
        overflow: hidden;
    }

    th, td { 
        border: 1px solid #d7ccc8; 
        padding: 8px; 
        text-align: center; 
    }

    th { 
        background: #a1887f; /* café claro */
        color: white; 
    }

    tbody tr:nth-child(even) { 
        background-color: #f7ede2; 
    }

    .no-results { 
        text-align: center; 
        color: #d84315; /* tono terracota */
        font-weight: bold; 
    }
</style>
</head>
<div th:replace="~{fragments/header :: header}"></div>
<body>

<h2>Búsquedas de Clientes</h2>

<div class="search-container">
    <form th:action="@{/busquedas/porNombre}" method="post" class="search-form">
        <div class="form-row">
            <input type="text" name="nombre" placeholder="Buscar por nombre">
            <button type="submit">Buscar</button>
        </div>
    </form>

    <form th:action="@{/busquedas/porEmail}" method="post" class="search-form">
        <div class="form-row">
            <input type="email" name="email" placeholder="Buscar por email exacto">
            <button type="submit">Buscar</button>
        </div>
    </form>

    <form th:action="@{/busquedas/porNombreContiene}" method="post" class="search-form">
        <div class="form-row">
            <input type="text" name="cadena" placeholder="Buscar por nombre que contenga">
            <button type="submit">Buscar</button>
        </div>
    </form>

    <form th:action="@{/busquedas/entreCreditos}" method="post" class="search-form">
        <div class="form-row">
            <input type="number" step="0.01" name="min" placeholder="Crédito mínimo">
            <input type="number" step="0.01" name="max" placeholder="Crédito máximo">
            <button type="submit">Buscar</button>
        </div>
    </form>

    <form th:action="@{/busquedas/mayorCredito}" method="post" class="search-form">
        <div class="form-row">
            <input type="number" step="0.01" name="monto" placeholder="Crédito mayor a">
            <button type="submit">Buscar</button>
        </div>
    </form>

    <form th:action="@{/busquedas/nombreCredito}" method="post" class="search-form">
        <div class="form-row">
            <input type="text" name="nombre" placeholder="Nombre">
            <input type="number" step="0.01" name="credito" placeholder="Crédito mínimo">
            <button type="submit">Buscar</button>
        </div>
    </form>
</div>

<!-- Botones rápidos -->
<div class="buttons">
    <a th:href="@{/busquedas/gmail}"><button type="button">E-mails @gmail.com</button></a>
    <a th:href="@{/busquedas/destacados}"><button type="button">Clientes Destacados</button></a>
    <a th:href="@{/busquedas/fotoNoImagen}"><button type="button">Foto no_imagen.jpg</button></a>
    <a th:href="@{/busquedas/top5}"><button type="button">Top 5 Crédito</button></a>
</div>

<!-- Tabla de resultados -->
<table>
    <thead>
        <tr>
            <th>ID</th><th>Nombre</th><th>Apellidos</th><th>Email</th>
            <th>Crédito</th><th>Destacado</th><th>Foto</th>
        </tr>
    </thead>
    <tbody>
        <tr th:if="${clientes != null and #lists.isEmpty(clientes)}">
            <td colspan="7" class="no-results">No hay clientes con esa búsqueda.</td>
        </tr>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.apellidos}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.credito}"></td>
            <td th:text="${c.destacado}"></td>
            <td th:text="${c.nombreFoto}"></td>
        </tr>
    </tbody>
</table>
<div style="margin-top: 20px;"> <a th:href="@{/clientes/listadocli}"> <button type="submit">Volver</button> </a> </div>
</body>

<div th:replace="~{fragments/footer :: footer}"></div>
</html>
